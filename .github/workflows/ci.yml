name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Verify deployment artifact
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/articles/hosting-nextjs-on-aws/index.html

      - name: Upload static export
        uses: actions/upload-artifact@v7
        with:
          name: bytetrove-static-export
          path: out
          if-no-files-found: error
          retention-days: 7
