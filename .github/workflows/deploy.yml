name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  S3_BUCKET: bytetrove-professional-site-720546261328-us-west-2-an
  CLOUDFRONT_DISTRIBUTION_ID: E13II6X9F078ZL
  SITE_URL: https://labs.aws.bytetrove.xyz

jobs:
  deploy:
    name: Build and deploy static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://labs.aws.bytetrove.xyz

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Verify deployment artifact
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/articles/hosting-nextjs-on-aws/index.html

      - name: Archive deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: bytetrove-production-${{ github.sha }}
          path: out
          if-no-files-found: error
          retention-days: 30

      - name: Assume ByteTrove deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::720546261328:role/ByteTroveGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: bytetrove-deploy-${{ github.run_id }}
          role-duration-seconds: 900
          allowed-account-ids: "720546261328"

      - name: Upload immutable Next.js assets
        run: |
          aws s3 sync out/_next/static/ "s3://$S3_BUCKET/_next/static/" \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors

      - name: Publish site files
        run: |
          aws s3 sync out/ "s3://$S3_BUCKET/" \
            --delete \
            --exclude "_next/static/*" \
            --cache-control "public,max-age=0,must-revalidate" \
            --only-show-errors

      - name: Invalidate CloudFront
        id: invalidate
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)

          echo "id=$invalidation_id" >> "$GITHUB_OUTPUT"

          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$invalidation_id"

      - name: Smoke test production
        run: |
          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "$SITE_URL/" | grep --quiet "ByteTrove"

          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "$SITE_URL/articles/hosting-nextjs-on-aws/" | grep --quiet "Hosting Next.js on AWS"

      - name: Write deployment summary
        run: |
          {
            echo "## ByteTrove production deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Environment: \`production\`"
            echo "- S3 bucket: \`$S3_BUCKET\`"
            echo "- CloudFront invalidation: \`${{ steps.invalidate.outputs.id }}\`"
            echo "- Site: $SITE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
